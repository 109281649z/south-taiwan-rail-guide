<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>港都選物 GO｜TDX Rail POC V1</title>

  <style>
    :root {
      --bg: #f5f3ed;
      --card: #ffffff;
      --text: #1e2927;
      --muted: #6c7774;
      --primary: #176b5b;
      --primary-dark: #105447;
      --accent: #d8a13b;
      --line: #e5e2d9;
      --danger: #a94442;
      --success-bg: #edf7f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      margin-bottom: 28px;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 52px);
      margin: 0;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 760px;
    }

    .panel {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
      margin-bottom: 22px;
    }

    .route-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    select,
    input[type="time"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      background: #fff;
      font-size: 16px;
    }

    .arrow {
      font-size: 25px;
      padding-bottom: 10px;
      color: var(--primary);
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      margin-top: 18px;
      align-items: end;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #eef1ef;
      color: var(--text);
    }

    .status {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--success-bg);
      font-size: 14px;
      line-height: 1.6;
      margin-top: 16px;
    }

    .status.error {
      background: #fff0ef;
      color: var(--danger);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .section-title span {
      font-size: 13px;
      color: var(--muted);
    }

    .train-list {
      display: grid;
      gap: 14px;
    }

    .train-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      transition: 0.2s ease;
    }

    .train-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .train-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .train-number {
      font-size: 18px;
      font-weight: 800;
    }

    .train-type {
      display: inline-block;
      margin-left: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #edf3f1;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .duration {
      font-size: 13px;
      color: var(--muted);
    }

    .timeline {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
    }

    .time {
      font-size: 28px;
      font-weight: 800;
    }

    .station {
      color: var(--muted);
      margin-top: 3px;
    }

    .timeline-line {
      min-width: 140px;
      height: 2px;
      background: var(--line);
      position: relative;
    }

    .timeline-line::before,
    .timeline-line::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
      top: 50%;
      transform: translateY(-50%);
    }

    .timeline-line::before {
      left: 0;
    }

    .timeline-line::after {
      right: 0;
    }

    .arrival {
      text-align: right;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .badge {
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 8px;
      background: #f4f4f1;
      color: #5e6664;
    }

    .empty {
      text-align: center;
      padding: 45px 15px;
      color: var(--muted);
    }

    .import-area {
      border-top: 1px solid var(--line);
      margin-top: 22px;
      padding-top: 18px;
    }

    .import-area p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    input[type="file"] {
      margin-top: 8px;
    }

    .debug {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .route-row {
        grid-template-columns: 1fr;
      }

      .arrow {
        transform: rotate(90deg);
        text-align: center;
        padding: 0;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .timeline-line {
        min-width: 60px;
      }

      .time {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="brand">PORT CITY PICKS · 港都選物</div>

    <h1>港都選物 GO</h1>

    <div class="subtitle">
      從高雄出發，用真實交通資料找出現在可以搭的下一班火車。
      TDX Rail POC V1。
    </div>
  </header>


  <section class="panel">

    <div class="route-row">

      <div>
        <label>出發站</label>
        <select id="origin">
          <option value="4400">高雄 Kaohsiung</option>
        </select>
      </div>

      <div class="arrow">→</div>

      <div>
        <label>目的地</label>
        <select id="destination">
          <option value="4220">臺南 Tainan</option>
        </select>
      </div>

    </div>


    <div class="settings">

      <div>
        <label>出發時間</label>
        <input id="departureTime" type="time" />
      </div>

      <div>
        <label>顯示班次</label>
        <select id="resultCount">
          <option value="3">下一班＋後 2 班</option>
          <option value="5">顯示 5 班</option>
          <option value="10">顯示 10 班</option>
        </select>
      </div>

      <button class="primary" id="searchButton">
        查詢班次
      </button>

    </div>

    <div id="status" class="status">
      尚未載入 TDX 資料。
    </div>


    <div class="import-area">

      <strong>TDX JSON 備援模式</strong>

      <p>
        如果瀏覽器直接呼叫 TDX 失敗，
        可以把 Swagger 下載的 DailyTrainTimetable JSON
        直接拖進來測試。
      </p>

      <input
        type="file"
        id="jsonFile"
        accept=".json,application/json"
      />

    </div>

  </section>


  <section class="panel">

    <div class="section-title">

      <h2>推薦班次</h2>

      <span id="resultInfo">
        高雄 → 臺南
      </span>

    </div>

    <div id="trainList" class="train-list">

      <div class="empty">
        請先載入 TDX 資料。
      </div>

    </div>

  </section>


  <section class="panel">

    <div class="section-title">
      <h2>POC 狀態</h2>
    </div>

    <div class="debug" id="debugInfo">
      origin = 4400<br>
      destination = 4220<br>
      data source = 尚未載入
    </div>

  </section>

</div>


<script>

/* =========================================================
   港都選物 GO
   TDX Rail POC V1

   Origin:
   高雄 StationID = 4400

   Destination:
   臺南 StationID = 4220
========================================================= */


const TDX_URL =
  "https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/DailyTrainTimetable/Today?$format=JSON";


let railData = null;
let dataSource = null;


/* =========================================================
   Utility
========================================================= */

function timeToMinutes(time) {

  if (!time) return null;

  const parts = time.split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


function minutesToDuration(minutes) {

  if (minutes < 60) {
    return `${minutes} 分鐘`;
  }

  const hour = Math.floor(minutes / 60);
  const min = minutes % 60;

  if (min === 0) {
    return `${hour} 小時`;
  }

  return `${hour} 小時 ${min} 分`;
}


function getCurrentTaiwanTime() {

  const formatter =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone: "Asia/Taipei",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

  return formatter.format(new Date());

}


/* =========================================================
   核心：分析 TrainTimetables
========================================================= */

function buildTrips(
  data,
  originID,
  destinationID
) {

  if (!data || !Array.isArray(data.TrainTimetables)) {
    return [];
  }


  const results = [];


  for (const train of data.TrainTimetables) {

    const info = train.TrainInfo;

    const stops = train.StopTimes || [];


    const origin =
      stops.find(
        stop => stop.StationID === originID
      );


    const destination =
      stops.find(
        stop => stop.StationID === destinationID
      );


    /*
      必須同時停靠兩站
    */

    if (!origin || !destination) {
      continue;
    }


    /*
      關鍵：
      高雄 StopSequence
      必須小於
      臺南 StopSequence

      才代表高雄 → 臺南
    */

    if (
      Number(origin.StopSequence) >=
      Number(destination.StopSequence)
    ) {
      continue;
    }


    /*
      排除停駛
    */

    if (
      Number(info?.SuspendedFlag) !== 0 ||
      Number(origin.SuspendedFlag) !== 0 ||
      Number(destination.SuspendedFlag) !== 0
    ) {
      continue;
    }


    const departureMinutes =
      timeToMinutes(origin.DepartureTime);


    const arrivalMinutes =
      timeToMinutes(destination.ArrivalTime);


    let duration =
      arrivalMinutes - departureMinutes;


    /*
      預防跨午夜
    */

    if (duration < 0) {
      duration += 24 * 60;
    }


    results.push({

      trainNo:
        info?.TrainNo || "",

      trainType:
        info?.TrainTypeName?.Zh_tw || "臺鐵",

      trainTypeEn:
        info?.TrainTypeName?.En || "",

      direction:
        info?.Direction,

      headSign:
        info?.TripHeadSign || "",

      departure:
        origin.DepartureTime,

      arrival:
        destination.ArrivalTime,

      duration,

      originName:
        origin.StationName?.Zh_tw || originID,

      destinationName:
        destination.StationName?.Zh_tw || destinationID,

      bike:
        info?.BikeFlag === 1,

      wheelchair:
        info?.WheelChairFlag === 1,

      daily:
        info?.DailyFlag === 1,

      note:
        info?.Note || ""

    });

  }


  /*
    按高雄出發時間排序
  */

  results.sort(
    (a, b) =>
      timeToMinutes(a.departure) -
      timeToMinutes(b.departure)
  );


  return results;

}


/* =========================================================
   篩選指定時間之後的列車
========================================================= */

function filterUpcomingTrips(
  trips,
  selectedTime,
  count
) {

  const selectedMinutes =
    timeToMinutes(selectedTime);


  return trips
    .filter(
      trip =>
        timeToMinutes(trip.departure) >=
        selectedMinutes
    )
    .slice(0, count);

}


/* =========================================================
   Render
========================================================= */

function renderTrips(trips) {

  const container =
    document.getElementById("trainList");


  if (!trips.length) {

    container.innerHTML = `
      <div class="empty">
        此時間之後找不到符合條件的高雄 → 臺南班次。
      </div>
    `;

    return;
  }


  container.innerHTML =
    trips.map((trip, index) => {

      const badges = [];


      if (trip.wheelchair) {
        badges.push("無障礙");
      }


      if (trip.bike) {
        badges.push("自行車");
      }


      if (trip.daily) {
        badges.push("每日行駛");
      }


      return `

        <article class="train-card">

          <div class="train-top">

            <div>

              <span class="train-number">
                ${index === 0 ? "下一班 · " : ""}
                ${escapeHTML(trip.trainNo)} 次
              </span>

              <span class="train-type">
                ${escapeHTML(cleanTrainType(trip.trainType))}
              </span>

            </div>

            <div class="duration">
              約 ${minutesToDuration(trip.duration)}
            </div>

          </div>


          <div class="timeline">

            <div>

              <div class="time">
                ${escapeHTML(trip.departure)}
              </div>

              <div class="station">
                ${escapeHTML(trip.originName)} 出發
              </div>

            </div>


            <div class="timeline-line"></div>


            <div class="arrival">

              <div class="time">
                ${escapeHTML(trip.arrival)}
              </div>

              <div class="station">
                ${escapeHTML(trip.destinationName)} 抵達
              </div>

            </div>

          </div>


          <div class="badges">

            <span class="badge">
              ${escapeHTML(trip.headSign)}
            </span>

            ${badges
              .map(
                badge =>
                  `<span class="badge">${escapeHTML(badge)}</span>`
              )
              .join("")
            }

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   Search
========================================================= */

function searchTrips() {

  if (!railData) {

    showStatus(
      "尚未載入 TDX 資料。請先等待 API 載入，或匯入 JSON。",
      true
    );

    return;
  }


  const originID =
    document.getElementById("origin").value;


  const destinationID =
    document.getElementById("destination").value;


  const selectedTime =
    document.getElementById("departureTime").value;


  const count =
    Number(
      document.getElementById("resultCount").value
    );


  const allTrips =
    buildTrips(
      railData,
      originID,
      destinationID
    );


  const upcoming =
    filterUpcomingTrips(
      allTrips,
      selectedTime,
      count
    );


  renderTrips(upcoming);


  document.getElementById("resultInfo").textContent =
    `找到 ${allTrips.length} 班符合路線 · 顯示 ${upcoming.length} 班`;


  document.getElementById("debugInfo").innerHTML = `
    origin = ${originID}<br>
    destination = ${destinationID}<br>
    query time = ${selectedTime}<br>
    matched trains = ${allTrips.length}<br>
    data source = ${escapeHTML(dataSource || "unknown")}<br>
    TrainDate = ${escapeHTML(railData.TrainDate || "")}
  `;

}


/* =========================================================
   TDX API
========================================================= */

async function loadTDX() {

  showStatus(
    "正在嘗試讀取 TDX 臺鐵當日時刻表..."
  );


  try {

    const response =
      await fetch(
        TDX_URL,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    if (!data.TrainTimetables) {

      throw new Error(
        "TDX 回傳格式中沒有 TrainTimetables"
      );

    }


    railData = data;

    dataSource = "TDX Live API";


    showStatus(
      `TDX 資料載入成功。TrainDate：${data.TrainDate}`
    );


    searchTrips();

  }

  catch (error) {

    console.error(error);


    showStatus(
      "瀏覽器直接呼叫 TDX 失敗。這在訪客模式、CORS 或 API 驗證限制下可能發生。請使用下方「TDX JSON 備援模式」匯入剛才從 Swagger 下載的 JSON。",
      true
    );


    document.getElementById("debugInfo").innerHTML = `
      TDX API load failed<br>
      ${escapeHTML(error.message)}
    `;

  }

}


/* =========================================================
   Import JSON
========================================================= */

document
  .getElementById("jsonFile")
  .addEventListener(
    "change",
    async function(event) {

      const file =
        event.target.files[0];


      if (!file) return;


      try {

        const text =
          await file.text();


        const data =
          JSON.parse(text);


        if (!Array.isArray(data.TrainTimetables)) {

          throw new Error(
            "這個 JSON 沒有 TrainTimetables，請確認匯入的是 DailyTrainTimetable 資料。"
          );

        }


        railData = data;

        dataSource =
          `Local JSON：${file.name}`;


        showStatus(
          `JSON 載入成功。TrainDate：${data.TrainDate}`
        );


        searchTrips();

      }

      catch (error) {

        showStatus(
          `JSON 載入失敗：${error.message}`,
          true
        );

      }

    }
  );


/* =========================================================
   UI
========================================================= */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchTrips
  );


function showStatus(
  message,
  isError = false
) {

  const status =
    document.getElementById("status");


  status.textContent = message;


  status.classList.toggle(
    "error",
    isError
  );

}


function cleanTrainType(type) {

  if (!type) return "臺鐵";


  if (type.includes("3000")) {
    return "EMU3000 自強";
  }


  if (type.includes("自強")) {
    return "自強";
  }


  if (type.includes("區間快")) {
    return "區間快";
  }


  if (type.includes("區間")) {
    return "區間";
  }


  if (type.includes("普悠瑪")) {
    return "普悠瑪";
  }


  if (type.includes("莒光")) {
    return "莒光";
  }


  return type;

}


function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   Initial
========================================================= */

const currentTime =
  getCurrentTaiwanTime();


document.getElementById(
  "departureTime"
).value = currentTime;


/*
  自動嘗試 TDX API
*/

loadTDX();

</script>

</body>
</html>
